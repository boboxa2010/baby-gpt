defaults:
  - shakespeare_char
  - _self_

train_samples_per_epoch: 3000

model:
  n_layers: 4
  num_heads: 4
  hidden_dim: 128
  block_size: 64
  emb_dropout: 0.0
  attn_dropout: 0.0
  resid_dropout: 0.0
  mlp_dropout: 0.0

datasets:
  val:
    limit: 240

dataloader:
  batch_size: 12

lr_scheduler:
  pct_start: 0.05

trainer:
  n_epochs: 8
  epoch_len: 250
  log_step: 1
